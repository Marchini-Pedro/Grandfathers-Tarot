name: Grandfather's Tarot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline verification (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [lua55, luajit21]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-test.txt
      - name: Install verification dependencies
        run: python -m pip install -r tools/requirements-test.txt
      - name: Compile Lua, run offline tests and enforce coverage
        run: python tools/run_tests.py --runtime ${{ matrix.runtime }} --output-dir test-results/${{ matrix.runtime }}
      - name: Upload test logs and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarot-verification-${{ matrix.runtime }}
          path: test-results/${{ matrix.runtime }}/
          if-no-files-found: error
